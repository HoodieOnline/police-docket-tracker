<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docket Tracker SA • Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-mark">
          <img src="{{ url_for('static', filename='images/saps-emblem-transparent.png') }}" alt="South African Police Service emblem" />
        </div>
        <div>
          <h2>Docket Tracker SA</h2>
          <p>Public safety case registration and audit control</p>
        </div>
      </div>
      <div class="prototype-notice">Prototype</div>

      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" class="login-form">
        <label>
          Username
          <input type="text" name="username" value="admin" required />
        </label>
        <label>
          Password
          <input type="password" name="password" value="admin123" required />
        </label>
        <button type="submit" class="primary-btn wide">Login to dashboard</button>
      </form>

      <div class="demo-credentials">
        <span>Demo credentials</span>
        <div class="demo-credential-list">
          <div><strong>admin</strong><span>admin123</span><small>System Administrator</small></div>
          <div><strong>commander</strong><span>commander123</span><small>Station Commander</small></div>
          <div><strong>detective</strong><span>detective123</span><small>Detective</small></div>
          <div><strong>clerk</strong><span>clerk123</span><small>Admin Clerk</small></div>
        </div>
      </div>
    </div>
  </body>
</html>
